name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options: [release, rc, beta, alpha]
      base_version:
        description: "Override MAJOR.MINOR.PATCH (blank = keep current)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          server-id: github

      # Tags are the source of truth for "next N" per channel — no separate counter file.
      - name: Compute release version
        id: ver
        run: |
          set -euo pipefail
          CURRENT="$(grep -m1 -oP '(?<=<revision>)[^<]+' pom.xml)"
          MMP="${{ inputs.base_version }}"
          if [ -z "$MMP" ]; then
            MMP="$(echo "$CURRENT" | sed -E 's/-.*$//')"
          fi
          CHANNEL="${{ inputs.channel }}"
          if [ "$CHANNEL" = "release" ]; then
            VERSION="$MMP"
            TAG="v${MMP}"
          else
            PREFIX="v${MMP}-${CHANNEL}"
            LAST="$(git tag -l "${PREFIX}*" | sed -E "s/^${PREFIX}//" | sort -n | tail -1)"
            NEXT=$(( ${LAST:-0} + 1 ))
            VERSION="${MMP}-${CHANNEL}${NEXT}"
            TAG="${PREFIX}${NEXT}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "docker_tags<<EOF"
            echo "ghcr.io/martecyber/ares-core:${VERSION}"
            # :latest always follows the most recent release workflow run, release or prerelease
            # alike — a plain `docker pull` always gets the newest build regardless of channel.
            # Revisit if/when that stops being the desired semantics for :latest.
            echo "ghcr.io/martecyber/ares-core:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bump pom.xml, commit, and tag
        run: |
          set -euo pipefail
          sed -i -E "s#<revision>[^<]+</revision>#<revision>${{ steps.ver.outputs.version }}</revision>#" pom.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${{ steps.ver.outputs.tag }}"
          else
            echo "pom.xml already at ${{ steps.ver.outputs.version }} — tagging current HEAD without a new commit"
          fi
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin HEAD:main "${{ steps.ver.outputs.tag }}"

      - name: Build, test, and publish release package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp deploy

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.ver.outputs.docker_tags }}
