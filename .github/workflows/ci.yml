name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          server-id: github

      # Intermediate version = whatever is committed in pom.xml's <revision>, plus the short
      # commit hash as SemVer build metadata — never rewrites the committed pom.xml itself.
      - name: Compute intermediate version
        id: ver
        run: |
          set -euo pipefail
          BASE="$(grep -m1 -oP '(?<=<revision>)[^<]+' pom.xml)"
          SHA="${GITHUB_SHA:0:7}"
          echo "version=${BASE}+${SHA}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${BASE}-${SHA}" >> "$GITHUB_OUTPUT"

      # Runs the full test suite (incl. Testcontainers — Docker is preinstalled on this runner)
      # and publishes the jar to GitHub Packages, for the handful of plugins still depending on
      # it directly.
      - name: Build, test, and publish intermediate package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp "-Drevision=${{ steps.ver.outputs.version }}" deploy

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/martecyber/ares-core:${{ steps.ver.outputs.docker_tag }}
            ghcr.io/martecyber/ares-core:main
