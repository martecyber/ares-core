# Development profile — for local dev against infra/docker-compose.yml
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ares?currentSchema=ares
    username: ares
    password: ares
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  data:
    redis:
      host: localhost
      port: 6379
      password: ares

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    com.martecyber.ares: DEBUG
    org.springframework.security: DEBUG

ares:
  jwt:
    # Dev-only fixed secret. Override in prod via ARES_JWT_SECRET env var.
    secret: "dev-only-jwt-secret-change-me-for-anything-remotely-real-32b"
  storage:
    s3:
      endpoint: http://localhost:9000
      access-key: aresadmin
      secret-key: aresadminpass
  # Component versions (GET /api/v1/versions) are read from the build itself — see
  # PlatformVersions. Set ares.versions.{api,cli,agent} only to override them.
  timezone: "UTC"
